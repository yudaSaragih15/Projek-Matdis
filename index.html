<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta FMIPA Unimed - Shortest Path</title>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS via CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* Peta harus memenuhi layar */
        #map { height: 100vh; width: 100%; z-index: 1; }
        /* Agar sidebar bisa di-scroll jika layar kecil */
        .sidebar-scroll { max-height: 100vh; overflow-y: auto; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <div class="flex flex-col md:flex-row h-screen w-screen overflow-hidden">
        
        <!-- SIDEBAR KIRI (Panel Kontrol) -->
        <div class="w-full md:w-1/3 bg-white shadow-xl z-10 p-6 flex flex-col gap-4 sidebar-scroll">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Navigasi FMIPA Unimed</h1>
                <p class="text-sm text-gray-500 mt-1">Sistem Pencarian Rute Terpendek (Algoritma Dijkstra)</p>
            </div>
            
            <hr class="my-2 border-gray-200">

            <!-- Pilihan Titik Awal -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Lokasi Awal</label>
                <select id="start-node" class="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 bg-gray-50">
                    <!-- Opsi diisi oleh JavaScript -->
                </select>
            </div>

            <!-- Pilihan Titik Tujuan -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Lokasi Tujuan</label>
                <select id="end-node" class="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 bg-gray-50">
                    <!-- Opsi diisi oleh JavaScript -->
                </select>
            </div>

            <!-- Tombol Cari Rute -->
            <button id="find-route-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition duration-200 mt-2 shadow-md">
                Cari Rute Terpendek
            </button>

            <!-- Hasil Pencarian -->
            <div id="result-panel" class="mt-4 p-4 bg-blue-50 border border-blue-200 rounded-md hidden">
                <h3 class="font-bold text-gray-800 mb-2">Hasil Rute:</h3>
                <p id="result-distance" class="text-sm font-semibold text-blue-700 mb-3"></p>
                <ul id="result-path" class="list-decimal list-inside text-sm text-gray-700 space-y-1"></ul>
            </div>
        </div>

        <!-- PETA (Kanan) -->
        <div class="w-full md:w-2/3 relative h-1/2 md:h-full">
            <div id="map"></div>
        </div>
    </div>

    <!-- Leaflet JS via CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- File JavaScript Proyek Kita (Urutan harus benar) -->
    <script src="js/graph.js"></script>
    <script src="js/dijkstra.js"></script>
    <script src="js/map.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
